plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'com.modrinth.minotaur' version '2.9.0'
}

version = project.mod_version
group = project.maven_group

repositories {
    maven {
        name = "JustBecause Public Maven"
        url = "https://justbecauseph.github.io/maven/"
        content {
            includeGroup "me.justbecause.distantdecorations"
        }
    }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "fastpaintings" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "fastpaintings-gametest"

        enableGameTests = true
        enableClientGameTests = false

        // Required to run server GameTests.
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Optional Distant Decorations API integration.
    // Compile against the stable public Maven coordinate without requiring DD at runtime.
    compileOnly "me.justbecause.distantdecorations:distant-decorations:0.1.0"

    // Tests
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

processResources {
    def version = project.version
    def minecraftDependency = project.minecraft_dependency
    def loaderVersion = project.loader_version
    def fabricApiDependency = project.fabric_api_dependency

    inputs.property "version", version
    inputs.property "minecraft_dependency", minecraftDependency
    inputs.property "loader_version", loaderVersion
    inputs.property "fabric_api_dependency", fabricApiDependency

    filesMatching("fabric.mod.json") {
        expand(
            "version": version,
            "minecraft_dependency": minecraftDependency,
            "loader_version": loaderVersion,
            "fabric_api_dependency": fabricApiDependency
        )
    }
}

configurations {
    metadataTestClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    metadataTestClasspath "net.fabricmc:fabric-loader:${project.loader_version}"
    metadataTestClasspath "org.junit.jupiter:junit-jupiter:5.11.4"
    metadataTestClasspath "org.apiguardian:apiguardian-api:1.1.2"
}

def compileMetadataTestJava = tasks.register("compileMetadataTestJava", JavaCompile) {
    source = fileTree("src/test/java/me/justbecause/fastpaintings/metadata")
    classpath = configurations.metadataTestClasspath
    destinationDirectory = layout.buildDirectory.dir("classes/java/metadataTest")
    options.release = 25
}

tasks.register("verifyMetadata", JavaExec) {
    dependsOn tasks.named("processResources"), compileMetadataTestJava
    classpath = files(
        compileMetadataTestJava.get().destinationDirectory,
        configurations.metadataTestClasspath
    )
    mainClass = "me.justbecause.fastpaintings.metadata.ModMetadataCompatibilityTest"
    systemProperty "fabric.mod.json.path", "${layout.buildDirectory.get()}/resources/main/fabric.mod.json"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = System.getenv("MODRINTH_PROJECT_ID")

    versionNumber = project.version.toString()
    versionName = "Really Fast Paintings ${project.version}"
    versionType = System.getenv("MODRINTH_VERSION_TYPE") ?: (project.version.toString().contains("-") ? "beta" : "release")

    // Minecraft 26.x uses the unobfuscated Loom plugin; the normal jar is the distributable artifact.
    uploadFile = tasks.jar

    gameVersions = [
        project.minecraft_version.toString()
    ]

    loaders = [
        "fabric"
    ]

    changelog = System.getenv("MODRINTH_CHANGELOG")
        ?: "See GitHub release notes."

    dependencies {
        required.project "fabric-api"
        optional.project "distant-decorations"
    }

    // Set MODRINTH_DEBUG=true to inspect the payload without publishing a version.
    debugMode = Boolean.parseBoolean(
        System.getenv("MODRINTH_DEBUG") ?: "false"
    )
}

// Publishing must not bypass the normal build/tests.
tasks.named("modrinth") {
    dependsOn tasks.named("build")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
